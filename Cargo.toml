[package]
name = "crypto-service-rust"
version = "0.1.0"
edition = "2021"
description = "Combining AES with TOTP for time-based key derivation."
repository = "https://github.com/aramzl/crypto-rust"

[lib]
# Overridden because the default would be `crypto_service_rust` (the package
# name with dashes replaced); dependents use `crypto_service`.
name = "crypto_service"

[dependencies]
openssl = "0.10.81"
hex = "0.4.3"
otpauth = "0.5.1"
